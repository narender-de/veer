<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veer - Exclusive Offer</title>
  <meta name="description" content="Exclusive limited offer landing page">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0%, #f7fbff 42%, #e7f5ff 100%);
      color: #17213d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 14px;
    }

    .offer-card {
      width: min(100%, 735px);
      min-height: 940px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 48px;
      padding: 28px 52px 48px;
      position: relative;
      box-shadow: 0 25px 70px rgba(31, 71, 130, 0.13);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .live-pill {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 208px;
      justify-content: center;
      padding: 11px 19px;
      border: 3px solid #ffc400;
      border-radius: 999px;
      background: #24428f;
      color: #ffd200;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 7px 18px rgba(26, 57, 117, 0.22);
      margin-bottom: 15px;
    }

    .live-dot {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ff3c3c;
      animation: livePulse 1.1s infinite;
      flex: 0 0 auto;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.78); opacity: 0.65; }
    }

    .logo-wrap {
      width: 342px;
      height: 342px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0;
      margin-bottom: 25px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.09);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .limited-badge {
      width: min(100%, 310px);
      height: 44px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffc900, #ffad08);
      color: #101d3c;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.08);
      margin-bottom: 13px;
    }

    .limited-badge .fire {
      color: #ff6337;
      font-size: 24px;
      line-height: 1;
    }

    .users-text {
      color: #9430f0;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 24px;
    }

    .warning {
      width: 100%;
      min-height: 49px;
      border: 1.5px dashed #ff5656;
      border-radius: 13px;
      background: #ffe4e4;
      color: #df2020;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 15px;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 30px;
    }

    .join-btn {
      width: min(100%, 395px);
      min-height: 90px;
      border: 0;
      border-radius: 48px;
      background: linear-gradient(180deg, #ffc900 0%, #ffae08 100%);
      color: #173f99;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 2px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 0 #c96305,
        0 17px 27px rgba(145, 91, 0, 0.18);
      transition: transform .16s ease, box-shadow .16s ease;
      margin-bottom: 28px;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 0 #c96305,
        0 20px 30px rgba(145, 91, 0, 0.22);
    }

    .join-btn:active {
      transform: translateY(7px);
      box-shadow:
        0 3px 0 #c96305,
        0 8px 15px rgba(145, 91, 0, 0.16);
    }

    .countdown {
      width: 100%;
      min-height: 92px;
      border: 3px solid #ffcc00;
      border-radius: 34px;
      background: #294592;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 7px 17px rgba(33, 61, 127, 0.08);
    }

    .countdown-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .countdown-number {
      width: 75px;
      height: 61px;
      border-radius: 13px;
      background: #fff;
      color: #294592;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
    }

    .seconds-label {
      white-space: nowrap;
    }

    .fine-print {
      margin-top: 28px;
      color: #71809b;
      font-size: 15px;
      text-align: center;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .offer-card {
        min-height: auto;
        border-radius: 30px;
        padding: 20px 20px 36px;
      }

      .live-pill {
        align-self: center;
        margin-bottom: 16px;
        font-size: 16px;
        min-width: 190px;
      }

      .logo-wrap {
        width: min(82vw, 342px);
        height: min(82vw, 342px);
        margin-bottom: 22px;
      }

      .limited-badge {
        font-size: 17px;
        height: 42px;
      }

      .users-text {
        font-size: 18px;
      }

      .warning {
        font-size: 16px;
        margin-bottom: 28px;
      }

      .join-btn {
        min-height: 78px;
        font-size: 26px;
        width: min(100%, 360px);
      }

      .countdown {
        min-height: 84px;
        border-radius: 27px;
        padding: 10px 12px;
        gap: 7px;
        font-size: 16px;
      }

      .countdown-number {
        width: 65px;
        height: 55px;
        font-size: 30px;
      }

      .fine-print {
        margin-top: 23px;
      }
    }

    @media (max-width: 390px) {
      .offer-card {
        padding-left: 14px;
        padding-right: 14px;
      }

      .countdown {
        font-size: 14px;
      }

      .countdown-number {
        width: 56px;
        height: 51px;
      }

      .join-btn {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="offer-card">

    <div class="live-pill" aria-label="Live clock">
      <span class="live-dot"></span>
      <span>LIVE</span>
      <span id="liveClock">00:00:00</span>
    </div>

    <div class="logo-wrap">
      <img
        src="https://walaisdeddy.github.io/public_html/veergamenewlogo.webp"
        alt="Veer Game"
      >
    </div>

    <div class="limited-badge">
      <span class="fire">♨</span>
      <span>LIMITED OFFER</span>
      <span class="fire">♨</span>
    </div>

    <div class="users-text">
      Daily Only 10 Users Allowed!
    </div>

    <div class="warning">
      ⏳&nbsp;&nbsp; Hurry Up! Grab Fast! Offer Ends Soon!
    </div>

    <a
      class="join-btn"
      href="https://www.veergame4.com/#/register?invitationCode=79695725122"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN NOW
    </a>

    <div class="countdown" aria-live="polite">
      <div class="countdown-label">
        <span>⌛</span>
        <span>Offer Expires in:</span>
      </div>

      <div class="countdown-number" id="countdown">10</div>

      <div class="seconds-label">Sec</div>
    </div>

    <div class="fine-print">
      * Limited seats available. Act now.
    </div>

  </main>

  <script>
    // Live clock
    function updateLiveClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('liveClock').textContent =
        `${hours}:${minutes}:${seconds}`;
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    // 10-second countdown
    let remaining = 10;
    const countdown = document.getElementById('countdown');

    function runCountdown() {
      countdown.textContent = remaining;

      if (remaining > 0) {
        remaining--;
        setTimeout(runCountdown, 1000);
      } else {
        countdown.textContent = '0';
      }
    }

    runCountdown();
  </script>

</body>
</html>
